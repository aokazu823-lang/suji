<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>おとねとひなねの さんすうゲーム</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#fff9eb"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#253047;background:#fff9eb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:1050px;margin:auto;min-height:100dvh;padding:16px 18px 28px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border-radius:50px;padding:9px 17px;background:#fff;border:2px solid #e8e0d0;font-weight:800}.muted{color:#68758b}h1{text-align:center;font-size:clamp(30px,6vw,56px);margin:20px 0 6px}.subtitle{text-align:center;font-size:clamp(17px,2.5vw,24px)}.pick{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:auto 0}.player{border:0;border-radius:30px;padding:35px 10px;background:#ffdeeb;color:#67324a;box-shadow:0 8px 0 #eeb8cc;font-size:clamp(24px,4vw,40px);font-weight:900}.player:nth-child(2){background:#d7edff;color:#254a76;box-shadow:0 8px 0 #a8cdec}.player small{display:block;font-size:18px;margin-top:10px}.hidden{display:none!important}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.progress{height:16px;border-radius:20px;background:#e7e9ef;overflow:hidden;margin:15px 0}.progress>div{height:100%;width:0;background:#ffb733;transition:width .2s}.question{background:white;border:3px solid #eee5d6;border-radius:30px;flex:1;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px 0 18px;padding:14px}.math{font-size:clamp(60px,11vw,120px);font-weight:900;letter-spacing:.02em;text-align:center;line-height:1.25}.objects{text-align:center;font-size:clamp(23px,4vw,40px);line-height:1.5;overflow-wrap:anywhere;max-width:100%}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.choices button{min-height:95px;border:0;border-radius:23px;background:#e0edff;color:#1f416b;font-size:clamp(38px,6vw,64px);font-weight:900;box-shadow:0 5px 0 #b7d0f2}.choices button:nth-child(2){background:#ffe2a7;color:#694412;box-shadow:0 5px 0 #e8c17c}.choices button:nth-child(3){background:#ddf6df;color:#275d34;box-shadow:0 5px 0 #b3d9b8}.choices button:nth-child(4){background:#f8dff0;color:#72345b;box-shadow:0 5px 0 #e5b7d3}.choices button:disabled{opacity:.6}.choices button.correct{outline:6px solid #38a66d;opacity:1}.feedback{text-align:center;font-size:clamp(20px,3vw,32px);font-weight:900;min-height:44px;margin:8px}.actions{text-align:center}.action{background:#293d63;color:white;border:0;border-radius:20px;padding:16px 30px;font-size:23px;font-weight:800;margin:8px}.stats{margin:18px auto;text-align:center;font-size:22px;line-height:1.8}.foot{text-align:center;margin-top:18px;font-size:14px}.toggle{border:2px solid #d8dfeb;background:#fff;border-radius:30px;padding:9px 15px;font-weight:700}@media(max-width:520px){main{padding:12px}.pick{gap:10px}.player{padding:25px 6px}.question{min-height:190px}.choices button{min-height:88px}.math{font-size:clamp(48px,12vw,70px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hidden{display:none !important}</style></head><body><main><section id="home"><h1>🌈 さんすうゲーム 🌈</h1><p class="subtitle">だれが あそぶ？</p><div class="pick"><button class="player" data-player="otone">🐰<br>おとね<small>こたえは 9まで</small></button><button class="player" data-player="hinane">🐱<br>ひなね<small>こたえは 20まで</small></button></div><p class="foot">たしざん ＋ ひきざん − ／ 10もんで クリア！</p></section><section id="game" class="hidden" style="flex:1;display:flex;flex-direction:column"><div class="top"><button class="toggle" id="back">⌂ もどる</button><strong id="who"></strong><button class="toggle" id="sound">🔊 おと ON</button></div><div class="bar" style="margin-top:14px"><span class="pill" id="round">1 / 10 もん</span><span class="pill" id="stars">⭐ 0</span><span class="pill" id="best">🏅 ベスト 0</span></div><div class="progress"><div id="fill"></div></div><div class="question"><div class="objects" id="objects"></div><div class="math" id="math"></div></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="choices" id="choices"></div><div class="actions"><button id="next" class="action hidden">つぎの もんだい ➜</button></div></section><section id="finish" class="hidden" style="text-align:center;margin:auto 0"><h1 id="finishTitle">🎉 クリア！</h1><div id="summary" class="stats"></div><button class="action" id="again">🔄 もういっかい！</button><button class="action" id="homeBtn">⌂ えらびなおす</button></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let player='',pool=[],used=new Set(),index=0,score=0,missed=false,locked=false,soundOn=true,audio=null;const names={otone:'🐰 おとね',hinane:'🐱 ひなね'};function show(id){for(const x of ['home','game','finish'])$(x).classList.toggle('hidden',x!==id)}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function generate(){const max=player==='otone'?9:20;const arr=[];for(let a=0;a<=max;a++)for(let b=0;b<=max;b++){if(a+b<=max)arr.push({a,b,op:'+',ans:a+b,key:`${a}+${b}`});if(a>=b)arr.push({a,b,op:'−',ans:a-b,key:`${a}-${b}`})}return shuffle(arr)}function play(ok){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const tones=ok?[523,659,784]:[300,240];tones.forEach((hz,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,now+i*.12);gain.gain.exponentialRampToValueAtTime(.13,now+i*.12+.02);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.12+.19);osc.connect(gain).connect(audio.destination);osc.start(now+i*.12);osc.stop(now+i*.12+.2)})}catch(e){}}function best(){try{return Number(localStorage.getItem('sansuu_best_'+player))||0}catch(e){return 0}}function saveBest(v){try{localStorage.setItem('sansuu_best_'+player,String(v))}catch(e){}}function start(p){player=p;pool=generate();used=new Set();index=0;score=0;show('game');$('who').textContent=names[player];$('best').textContent='🏅 ベスト '+best();question()}function getQuestion(){let q=pool.find(x=>!used.has(x.key));if(!q){pool=generate();used.clear();q=pool[0]}used.add(q.key);return q}let current;function question(){locked=false;missed=false;current=getQuestion();$('round').textContent=(index+1)+' / 10 もん';$('stars').textContent='⭐ '+score;$('fill').style.width=(index/10*100)+'%';$('math').textContent=`${current.a} ${current.op} ${current.b} = ?`;$('feedback').textContent='こたえを タッチしてね！';$('next').classList.add('hidden');$('objects').textContent='';if(player==='otone'&&current.a+current.b<=10&&Math.random()<.4){const icon=['🍎','🍓','⭐','🐟'][Math.floor(Math.random()*4)];$('objects').textContent=(icon.repeat(current.a)||'0')+' '+current.op+' '+(icon.repeat(current.b)||'0')}const max=player==='otone'?9:20,opts=new Set([current.ans]),count=player==='otone'?3:4;let offsets=shuffle([-3,-2,-1,1,2,3,4,-4,5,-5]);for(const d of offsets){const n=current.ans+d;if(n>=0&&n<=max)opts.add(n);if(opts.size>=count)break}while(opts.size<count)opts.add(Math.floor(Math.random()*(max+1)));$('choices').innerHTML='';shuffle([...opts]).forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.addEventListener('click',()=>answer(n,b));$('choices').appendChild(b)})}function answer(n,btn){if(locked)return;if(n===current.ans){locked=true;if(!missed)score++;btn.classList.add('correct');$('feedback').textContent=missed?'🌼 できたね！':'🎉 せいかい！ すごい！';play(true);[...$('choices').children].forEach(b=>b.disabled=true);$('stars').textContent='⭐ '+score;$('next').textContent=index===9?'けっかを みる 🏆':'つぎの もんだい ➜';$('next').classList.remove('hidden')}else{missed=true;btn.disabled=true;$('feedback').textContent='😊 おしい！ もういっかい！';play(false)}}function finish(){show('finish');$('finishTitle').textContent=score===10?'🏆 パーフェクト！':'🎉 10もん クリア！';$('summary').innerHTML=`${names[player]}<br>⭐ <strong>${score} / 10</strong> もん いっぱつせいかい！<br>${score===10?'🥇 きんメダル':score>=7?'🥈 ぎんメダル':'🥉 どうメダル'}`;if(score>best())saveBest(score)}document.querySelectorAll('[data-player]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.player)));$('next').addEventListener('click',()=>{index++;if(index>=10)finish();else question()});$('back').addEventListener('click',()=>show('home'));$('homeBtn').addEventListener('click',()=>show('home'));$('again').addEventListener('click',()=>start(player));$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 おと ON':'🔇 おと OFF'});})();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(e){console.warn('Offline setup:',e)})})}</script></body></html>
